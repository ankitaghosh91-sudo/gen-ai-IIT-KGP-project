[project]
name = "financial-document-copilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "datasets>=2.19",
    "fastapi>=0.115",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.50.0",
    "pillow>=10.0",
    "pytest>=9.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.36",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]

[tool.uv]
package = false
